name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            package: windows-x86_64
            binary: win-keeper.exe
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            package: windows-aarch64
            binary: win-keeper.exe
            archive: zip
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: linux-x86_64
            binary: win-keeper
            archive: tar
            linux: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: linux-aarch64
            binary: win-keeper
            archive: tar
            linux: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.linux
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target "${{ matrix.target }}"
        shell: bash
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/
          cp README.md config.example.toml LICENSE dist/package/
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cd dist/package && 7z a "../win-keeper-${GITHUB_REF_NAME}-${{ matrix.package }}.zip" .
          else
            tar -C dist/package -czf "dist/win-keeper-${GITHUB_REF_NAME}-${{ matrix.package }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/win-keeper-*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
