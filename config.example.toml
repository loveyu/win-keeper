[manager]
lang = "zh_CN"
start_with_system = true
minimize_to_tray = true
log_buffer_lines = 10000
log_buffer_bytes = 2097152
log_file_max_bytes = 10485760
log_line_max_bytes = 65536
stop_timeout_ms = 30000

[[tools]]
name = "example-worker"
command = "C:\\Tools\\example-worker.exe"
args = ["--config", "config.toml"]
workdir = "C:\\Tools"
# Optional graceful shutdown hook. WINKEEPER_PID contains the managed root PID.
# graceful_stop_command = "C:\\Tools\\example-worker-control.exe"
# graceful_stop_args = ["stop"]
admin = false
auto_start = true
auto_restart = true
restart_delay_ms = 3000
max_restart_count = 5
restart_window_seconds = 60

# Linux uses the same fields. Replace command/workdir with Linux paths:
# command = "/opt/example/bin/example-worker"
# workdir = "/opt/example"
